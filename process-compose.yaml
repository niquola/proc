version: "0.5"

processes:
  app:
    description: procs dev server
    command: "kill $(lsof -ti tcp:51837) 2>/dev/null; sleep 0.4; bun src/\\$main.ts"
    working_dir: "."
    environment:
      - "PORT=51837"
    availability:
      restart: "on_failure"
      backoff_seconds: 2
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: /
        port: 51837
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 10
      failure_threshold: 3
